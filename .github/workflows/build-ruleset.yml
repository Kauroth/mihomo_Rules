name: build ruleset

on:
  push:
    branches: [Kauroth]      # 注意：这个仓库的默认分支名是 Kauroth，不是 main
    paths:
      - 'rules/**'
      - 'sources/**'
      - 'scripts/**'
      - '.github/workflows/build-ruleset.yml'
  schedule:
    - cron: '0 3 * * *'      # 每天 03:00 北京时间，与上游构建时间对齐
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 建议不超过你客户端内核的版本
      MIHOMO_TAG: v1.19.34
    steps:
      - uses: actions/checkout@v4

      - name: 下载 mihomo 内核
        run: |
          set -euo pipefail
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-linux-amd64-compatible-${MIHOMO_TAG}.gz"
          curl -fsSL -o mihomo.gz "$url"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: 按 sources/ 拉取上游并归一化
        run: python3 scripts/fetch-sources.py

      - name: 编译规则集（非法行会让整个构建失败）
        env:
          MIHOMO: ./mihomo
        run: bash scripts/build.sh

      - name: 发布到 dist 分支
        run: |
          set -euo pipefail
          cd dist
          git init -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: ruleset @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist:dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
