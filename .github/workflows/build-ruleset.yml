name: build ruleset

on:
  push:
    branches: [main]      # 默认分支
    paths:
      - 'rules/**'
      - 'sources/**'
      - 'scripts/**'
      - '.github/workflows/build-ruleset.yml'
  schedule:
    - cron: '0 3 * * *'      # 每天 03:00 北京时间，与上游构建时间对齐
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 建议不超过你客户端内核的版本
      MIHOMO_TAG: v1.19.34
      SINGBOX_TAG: v1.14.4

    steps:
      - uses: actions/checkout@v4

      - name: 下载 mihomo 内核
        run: |
          set -euo pipefail
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-linux-amd64-compatible-${MIHOMO_TAG}.gz"
          curl -fsSL -o mihomo.gz "$url"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: 下载 sing-box 内核
        run: |
          set -euo pipefail
          v="${SINGBOX_TAG#v}"
          url="https://github.com/SagerNet/sing-box/releases/download/${SINGBOX_TAG}/sing-box-${v}-linux-amd64.tar.gz"
          curl -fsSL -o sing-box.tar.gz "$url"
          tar -xzf sing-box.tar.gz
          install -m755 "sing-box-${v}-linux-amd64/sing-box" ./sing-box
          ./sing-box version

      - name: 按 sources/ 拉取上游并归一化
        run: python3 scripts/fetch-sources.py

      # 构建成功 ≠ 数据是对的。上游改格式、丢属性标注、被 !opt 跳过，
      # 都会产出「看着正常但内容缩水」的规则集。这一步专门拦这种情况。
      - name: 环比检查（条数突降 / 属性退化就拦住）
        run: python3 scripts/check-regression.py

      # 上游删库时的退路：把这次拉到的原文存下来。
      # 用 if: always() 是为了让「检查失败时」也留档，方便回头查是哪家变了。
      - name: 快照原始上游
        if: always()
        run: |
          set -euo pipefail
          mkdir -p snapshot
          # 只要文本源：iptoasn 那两个 .gz 加起来十几 MB，每天存一份会撑爆 artifact 配额
          find .cache -type f ! -name '*.gz' -print0 2>/dev/null \
            | tar --null -czf "snapshot/upstream-$(date -u +%F).tar.gz" -T - || true
          ls -lh snapshot/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-snapshot
          path: snapshot
          retention-days: 14

      - name: 编译规则集（非法行会让整个构建失败）
        env:
          MIHOMO: ./mihomo
        run: bash scripts/build.sh

      # 必须放在 build.sh 之后：build.sh 开头会 rm -rf dist/，先跑会被清掉。
      # 同一份文本再出一套 sing-box 的 rule-set，语义一比一对应，不退化成 regex。
      - name: 编译 sing-box 规则集
        env:
          SINGBOX: ./sing-box
        run: python3 scripts/build-singbox.py

      # 条数环比只证明「产物没缩水」，这一步证明「规则真的能命中」。
      # 覆盖 +.x / x / CIDR 三种映射，用 sing-box 自己的匹配器验，失败就不发布。
      - name: 命中回归（sing-box 匹配语义）
        env:
          SINGBOX: ./sing-box
        run: python3 scripts/check-hit.py

      - name: 发布到 dist 分支
        run: |
          set -euo pipefail
          cd dist
          git init -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: ruleset @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist:dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 只有前面全过了才把这次的结果记成新基准。
      # baseline.json 不在上面 push.paths 里，所以这个提交不会再次触发本 workflow。
      - name: 更新环比基准
        if: success()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 注意要先 add 再比对：首次运行时 baseline.json 是未跟踪文件，
          # `git diff --quiet` 看不到它，会误判成「无变化」直接跳过。
          git add baseline.json
          if git diff --cached --quiet; then
            echo "基准无变化"
            exit 0
          fi
          git commit -q -m "chore: 更新环比基准"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
